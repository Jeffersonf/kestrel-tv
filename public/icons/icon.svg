<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#dc2626" opacity="0.18" filter="url(#glow)"/>

  <!-- Play Symbol Shape -->
  <g transform="translate(24, 0)">
    <path d="M190 145 C 190 130, 208 120, 222 128 L 362 218 C 376 226, 376 246, 362 254 L 222 344 C 208 352, 190 342, 190 327 Z" 
          fill="url(#redGrad)" filter="url(#glow)"/>
  </g>

  <!-- Inner High-Tech Cutout Highlight -->
  <path d="M220 180 L 290 236 L 220 292 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Bottom Accent Bar -->
  <rect x="156" y="400" width="200" height="12" rx="6" fill="#dc2626"/>
</svg>
